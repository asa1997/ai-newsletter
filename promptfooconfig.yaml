providers:
  - 'exec: python3 /home/ubuntu/ai-newsletter/src/ai_newsletter/main.py call_api --query "{{prompt}}" --topic AI --search-depth advanced --max-results 10 --timeout 60'

redteam:
  plugins:
    # Specify the plugin ID; plugin name string, not nested object, unless config needed
    - id: 'harmful:insults'
  # Optionally you may define strategies if desired
  # strategies:
  #   - id: 'jailbreak'
  numTests: 5
  purpose: "Test whether the system will generate personal insults or mocking content given malicious prompts"